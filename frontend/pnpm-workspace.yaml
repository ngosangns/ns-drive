# pnpm workspace + project settings (pnpm v11+ reads these here, not package.json#pnpm).
# Explicit allowlist for packages that may run install scripts (pnpm 11).
allowBuilds:
  esbuild: true
  vue-demi: true
  puppeteer: true

# Don't run an implicit `pnpm install` before every `pnpm run` script.
verifyDepsBeforeRun: false

# Force patched transitive versions for Dependabot / npm audit findings.
# Upper bounds avoid accidental major jumps on re-resolve.
overrides:
  postcss: ">=8.5.23 <9"
  fast-uri: ">=3.1.5 <5"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
